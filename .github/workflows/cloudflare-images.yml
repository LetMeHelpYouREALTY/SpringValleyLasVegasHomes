name: Cloudflare Images (heading photos)

on:
  push:
    branches: [main]
    paths:
      - "public/images/hero/**"
      - "public/images/properties/**"
      - "public/images/neighborhoods/**"
      - "public/images/icons/**"
      - "public/images/logos/**"
      - "public/images/agent/**"
      - "public/images/dr-jan-duffy.jpg"
      - "lib/heading-images.json"
      - "scripts/upload-heading-images-to-cloudflare.mjs"
      - ".github/workflows/cloudflare-images.yml"
  pull_request:
    paths:
      - "public/images/hero/**"
      - "public/images/properties/**"
      - "public/images/neighborhoods/**"
      - "public/images/icons/**"
      - "public/images/logos/**"
      - "public/images/agent/**"
      - "public/images/dr-jan-duffy.jpg"
      - "lib/heading-images.json"
      - "scripts/upload-heading-images-to-cloudflare.mjs"
      - ".github/workflows/cloudflare-images.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    name: Upload images to Cloudflare Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip when Cloudflare Images secrets are unset
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset; git JPEG backups remain in public/images/."
      - uses: actions/checkout@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          node-version: "20"
      - name: Upload (replace existing custom IDs on main)
        # `secrets` is not available in job-level `if`, so gate on job env instead.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CF_IMAGES_REPLACE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node scripts/upload-heading-images-to-cloudflare.mjs
